<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Basic Medical lifecycle — EIU MedLabs</title>
    <style>
      :root {
        --ink: #303033;
        --blue: #144069;
        --gold: #a78656;
        --canvas: #f8f6f1;
        --surface: #fff;
        --danger: #b44425;
        --success: #52813b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          15px "Segoe UI",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 1180px;
        margin: auto;
        padding: 28px;
      }
      h1 {
        color: var(--blue);
      }
      svg {
        width: 100%;
        min-width: 900px;
        background: var(--surface);
        border: 1px solid #ddd6cc;
        border-radius: 12px;
      }
      .st {
        fill: #fff;
        stroke: #144069;
        stroke-width: 2;
      }
      .good {
        fill: #f1f7ee;
        stroke: #52813b;
        stroke-width: 2;
      }
      .warn {
        fill: #fff8e5;
        stroke: #a78656;
        stroke-width: 2;
      }
      .bad {
        fill: #fff1ee;
        stroke: #b44425;
        stroke-width: 2;
      }
      .t {
        fill: #303033;
        font-size: 16px;
        font-weight: 600;
      }
      .s {
        fill: #56606a;
        font-size: 12px;
      }
      .a {
        stroke: #144069;
        stroke-width: 2;
        fill: none;
        marker-end: url(#a);
      }
      .d {
        stroke: #b44425;
        stroke-dasharray: 7 4;
        stroke-width: 2;
        fill: none;
        marker-end: url(#e);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Basic Medical lifecycle</h1>
      <p>
        Registration/session state and confirmation evidence state are separate,
        intentionally preserving invalidated historical evidence.
      </p>
      <svg
        viewBox="0 0 1080 520"
        role="img"
        aria-label="Basic Medical registration and confirmation lifecycle"
      >
        <defs>
          <marker
            id="a"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="3"
            orient="auto"
          >
            <path d="M0,0L0,6L9,3z" fill="#144069" />
          </marker>
          <marker
            id="e"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="3"
            orient="auto"
          >
            <path d="M0,0L0,6L9,3z" fill="#B44425" />
          </marker>
        </defs>
        <text class="t" x="65" y="55">Registration / session</text>
        <rect class="st" x="60" y="90" width="190" height="72" rx="12" />
        <text class="t" x="115" y="120">active</text>
        <text class="s" x="83" y="142">
          editable while source remains valid
        </text>
        <rect class="bad" x="345" y="90" width="190" height="72" rx="12" />
        <text class="t" x="402" y="120">cancelled</text>
        <text class="s" x="368" y="142">reason and authority required</text>
        <path class="d" d="M250 126H345" />
        <text class="s" x="260" y="112">manager cancellation</text>
        <text class="t" x="65" y="265">Confirmation evidence</text>
        <rect class="warn" x="60" y="300" width="190" height="78" rx="12" />
        <text class="t" x="104" y="331">eligible</text>
        <text class="s" x="85" y="351">
          active session, signer and inventory
        </text>
        <rect class="good" x="345" y="300" width="190" height="78" rx="12" />
        <text class="t" x="385" y="331">active evidence</text>
        <text class="s" x="365" y="351">signature + immutable snapshots</text>
        <rect class="bad" x="630" y="300" width="210" height="78" rx="12" />
        <text class="t" x="678" y="331">invalidated</text>
        <text class="s" x="655" y="351">original evidence retained</text>
        <path class="a" d="M250 339H345" />
        <text class="s" x="260" y="325">confirm session RPC</text>
        <path class="d" d="M535 339H630" />
        <text class="s" x="545" y="325">admin invalidation with reason</text>
        <path class="d" d="M440 162V300" />
        <text class="s" x="454" y="230">
          schedule change or cancellation invalidates evidence
        </text>
        <rect class="st" x="875" y="300" width="150" height="78" rx="12" />
        <text class="t" x="908" y="331">read evidence</text>
        <text class="s" x="894" y="351">scope-checked RPC/PDF</text>
        <path class="a" d="M840 339H875" />
      </svg>
      <p>
        State protection is implemented in RPCs, RLS, triggers, a partial unique
        index for active confirmations, and explicit audit records.
      </p>
    </main>
  </body>
</html>
