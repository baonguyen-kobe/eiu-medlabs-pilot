schema: spec-driven

context: |
  Product: MedLabs Calendar, an internal EIU scheduling system.
  Stack: Next.js 16 App Router, React 19, TypeScript, Supabase, Tailwind CSS.
  Roles: Follow the authoritative role and capability contracts in docs/DOCUMENTATION_AUTHORITY.md (Admin, Staff, Lecturer; import is an authorized capability, not a standalone role); enforce authorization and room-type scope server-side and via RLS.
  Code navigation: Direct source inspection and LSP first; optional code graphs (GitNexus, Graphify) only when useful. Consult NEXTJS_AGENTS.md only when modifying Next.js behavior.
  Delivery: Keep changes surgical, preserve desktop behavior when adding responsive layouts, and verify role-specific user paths.

rules:
  proposal:
    - State the user-visible outcome, non-goals, affected roles, data migration impact, and rollback considerations.
    - Identify authorization, RLS, email-notification, import/export, and responsive-layout impacts when relevant.
  specs:
    - Write testable requirements with explicit role and room-type scope.
    - Include conflict and failure behavior for scheduling mutations.
  tasks:
    - Order tasks by schema and authorization, server behavior, UI, then verification.
    - Include focused automated tests and a role-based manual verification checklist.

operations:
  apply:
    guidance:
      - Use direct source inspection and LSP first; consult optional code graphs only when useful. Graph inspection does not replace verification.
      - Preserve unrelated work and avoid speculative refactors.
  archive:
    guidance:
      - Record applicable migrations, runtime configuration, verification evidence, and known limitations. Non-release tasks must not force or simulate production release evidence.
